name: Game Room integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: supermega-launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anicolao/gameroom
          ref: f491693feb79a96e03143dacdf9af970ee13d29e
          path: .integration/gameroom
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: bun install --frozen-lockfile
        working-directory: .integration/gameroom
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gameroom
        env:
          GAMEROOM_PATH: .integration/gameroom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameroom-launch-review
          path: |
            .firebase/gameroom-review/*.png
            .firebase/gameroom-review/*.json
            .firebase/gameroom-review/*.html
            .firebase/gameroom-review/walkthroughs/*.json
